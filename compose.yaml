services:
  ai2b:
    build:
      context: .
    image: ai2b:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AI2B_PORT:-8765}:8765"
    environment:
      AI2B_LLM_BASE_URL: ${AI2B_LLM_BASE_URL:-}
      AI2B_LLM_MODEL: ${AI2B_LLM_MODEL:-}
      AI2B_LLM_API_KEY: ${AI2B_LLM_API_KEY:-}
      AI2B_TELEGRAM_BOT_TOKEN: ${AI2B_TELEGRAM_BOT_TOKEN:-}
      AI2B_TELEGRAM_CHAT_ID: ${AI2B_TELEGRAM_CHAT_ID:-}
    volumes:
      - ai2b_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ai2b_data:
