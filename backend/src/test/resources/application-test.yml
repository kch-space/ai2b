# Local-only tests: never inherit the developer's remote database credentials.
spring:
  datasource:
    url: jdbc:h2:mem:crypto_intelligence_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

market:
  instruments:
    sync-enabled: false
    cooldown-seconds: 0

  klines:
    enabled: false
    cooldown-seconds: 0
  metrics:
    enabled: false
  alerts:
    enabled: false
