spring:
  profiles:
    default: dev
  task:
    scheduling:
      pool:
        size: 2
  application:
    name: crypto-intelligence-backend
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
      initialization-fail-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true

server:
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

market:
  binance:
    rest-base-url: https://fapi.binance.com
  instruments:
    sync-enabled: true
    initial-delay-ms: 5000
    sync-interval-ms: 3600000
    cooldown-seconds: 60
  klines:
    enabled: true
    initial-delay-ms: 15000
    poll-interval-ms: 15000
    cooldown-seconds: 10
  metrics:
    enabled: true
    initial-delay-ms: 20000
    poll-interval-ms: 30000
  alerts:
    enabled: true
    initial-delay-ms: 25000
    poll-interval-ms: 5000

# Only local administration. Real integrations are disabled until explicitly saved/enabled.
integrations:
  master-key: ${AI2B_MASTER_KEY:}
  key-file: ${AI2B_KEY_FILE:${user.home}/.ai2b/integration.key}
  ai-allowed-hosts: ${AI2B_AI_ALLOWED_HOSTS:api.openai.com}
  allow-local-ai: ${AI2B_ALLOW_LOCAL_AI:false}
