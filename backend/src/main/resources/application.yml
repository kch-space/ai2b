spring:
  application:
    name: crypto-intelligence-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:43.137.12.22}:${DB_PORT:3306}/${DB_NAME:crypto_intelligence}?sslMode=REQUIRED&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=true&characterEncoding=UTF-8&connectTimeout=5000&socketTimeout=10000
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:kch123}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
      initialization-fail-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true

server:
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

market:
  binance:
    rest-base-url: ${BINANCE_REST_BASE_URL:https://fapi.binance.com}
  instruments:
    sync-enabled: ${INSTRUMENT_SYNC_ENABLED:true}
    initial-delay-ms: 5000
    sync-interval-ms: 3600000
    cooldown-seconds: 60
