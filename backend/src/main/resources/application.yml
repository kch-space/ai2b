spring:
  profiles:
    default: dev
  task:
    scheduling:
      pool:
        size: 2
  application:
    name: crypto-intelligence-backend
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 3000
      initialization-fail-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true

server:
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

market:
  binance:
    rest-base-url: https://fapi.binance.com
  instruments:
    sync-enabled: true
    initial-delay-ms: 5000
    sync-interval-ms: 3600000
    cooldown-seconds: 60
  klines:
    enabled: true
    initial-delay-ms: 15000
    poll-interval-ms: 15000
    cooldown-seconds: 10
  metrics:
    enabled: true
    initial-delay-ms: 20000
    poll-interval-ms: 30000
