# Activate with --spring.profiles.active=prod; supply production values at deployment.
# Development credentials are only stored in application-dev.yml.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:crypto_intelligence}?sslMode=REQUIRED&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&preserveInstants=true&rewriteBatchedStatements=true&characterEncoding=UTF-8&connectTimeout=5000&socketTimeout=10000
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

market:
  binance:
    rest-base-url: ${BINANCE_REST_BASE_URL:https://fapi.binance.com}
    api-key: ${BINANCE_API_KEY:}
    api-secret: ${BINANCE_API_SECRET:}
  instruments:
    sync-enabled: ${INSTRUMENT_SYNC_ENABLED:true}
  klines:
    enabled: ${KLINE_COLLECTION_ENABLED:true}
  metrics:
    enabled: ${METRIC_COLLECTION_ENABLED:true}
